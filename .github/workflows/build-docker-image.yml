name: Build Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - v*
  pull_request:
    branches:
      - main
      - dev
  release:
    types: [published]

permissions:
  contents: read

jobs:

  tests:
    uses: ./.github/workflows/tests.yml

  build:

    # Do not publish an image whose tests fail
    needs: tests

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: atmoswing/web-api

    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        load: true
        tags: atmoswing-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The image installs the latest dependencies, which may differ from the ones
    # of the tests: check that it starts and serves its routes
    - name: Smoke test
      run: |
        docker run -d --name api -p 8000:8000 atmoswing-api:test
        for i in $(seq 30); do
          status=$(docker inspect --format '{{.State.Health.Status}}' api)
          [ "$status" = "healthy" ] && break
          sleep 2
        done
        docker logs api
        [ "$status" = "healthy" ] || { echo "Container not healthy: $status"; exit 1; }
        curl -fsS http://localhost:8000/health
        curl -fsS http://localhost:8000/minidocs | grep -q "<h2>/forecasts/" \
          || { echo "/minidocs does not list the API routes"; exit 1; }
        [ "$(docker exec api id -u)" != "0" ] || { echo "The API runs as root"; exit 1; }
        docker rm -f api

    - name: Push
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
