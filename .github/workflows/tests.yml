name: Tests

on:
  push:
  pull_request:
  # Called by the workflows publishing the package and the Docker image
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    # Redis is used by the cache tests (they are skipped when it is not reachable)
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff
        pip install -e ".[test]"

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check . --select=E9,F63,F7,F82 --output-format=full
        # report the other findings (rules in pyproject.toml) as annotations, without failing
        ruff check . --exit-zero --output-format=github

    - name: Test with pytest
      run: |
        pytest
