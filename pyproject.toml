[project]
name = "atmoswing-api"
version = "1.1.1"
description = "A web API for AtmoSwing forecasts"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pascal Horton", email = "pascal.horton@terranum.ch" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "xarray",
    "h5netcdf",
    "h5py",
    "dask",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "typing-extensions",
    "slowapi",
    "jinja2",
    "redis>=4.6.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Search from project root and include the root package and all its subpackages
where = ["."]
include = ["atmoswing_api*"]

[tool.setuptools.package-data]
# Jinja templates used by the /minidocs route
atmoswing_api = ["templates/*.html"]
